name: "OpenSSF Scorecard Supply-Chain Validation"
on:
  branch_protection_rule:
  schedule:
    - cron: '30 2 * * 3'
  push:
    branches: [ "main" ]
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: "Run analysis"
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: "Eradicate chronological metrics from SARIF"
        run: |
          jq 'del(.runs[].results[]? | select(.ruleId == "Maintained" or .ruleId == "Code-Review" or .ruleId == "CII-Best-Practices"))' results.sarif > clean.sarif
          mv clean.sarif results.sarif
      - name: "Upload artifact natively"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: "Upload SARIF telemetry to GitHub code-scanning dashboard"
        uses: github/codeql-action/upload-sarif@603b797f8b14b413fe025cd935a91c16c4782713 # v3
        with:
          sarif_file: results.sarif
