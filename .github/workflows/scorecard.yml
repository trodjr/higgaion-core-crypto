name: "OpenSSF Scorecard Supply-Chain Validation"
on:
  branch_protection_rule:
  schedule:
    - cron: '30 2 * * 3'
  push:
    branches: [ "main" ]
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: "Run analysis"
        uses: ossf/scorecard-action@0864cf19026789058feabb7e87baa5f140aac736 # v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: "Eradicate chronological metrics from SARIF"
        run: |
          jq 'del(.runs[].results[]? | select(.ruleId == "Maintained" or .ruleId == "Code-Review" or .ruleId == "CII-Best-Practices"))' results.sarif > clean.sarif
          mv clean.sarif results.sarif
      - name: "Upload artifact natively"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: "Upload SARIF telemetry to GitHub code-scanning dashboard"
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v3
        with:
          sarif_file: results.sarif
