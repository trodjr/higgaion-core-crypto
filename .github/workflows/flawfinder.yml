name: "Flawfinder Legacy C Sub-System Isolation"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  flawfinder:
    name: Execute Flawfinder Bounds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install flawfinder
      run: sudo apt-get update && sudo apt-get install -y flawfinder
    - name: Scan Global C codebase natively for forbidden buffers
      run: flawfinder --error-level=4 src/ tests/ include/
