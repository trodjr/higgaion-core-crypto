name: Quad-Tier Formal Verification & C Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make gcc libssl-dev coq lcov

    - name: Run Gallina (Coq) Mechanized Proofs
      run: make verify

    - name: Run Equivalence Map Verification
      run: python3 scripts/verify_equivalence.py

    - name: Build C core primitives
      run: make prep obj/pqc_crypto.o

    - name: Setup Golang Environment
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.22'

    - name: Run Go CGO Language Binding Integration Tests
      run: make test-go

    - name: Setup Python Environment
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'



    - name: Run Python CTypes Language Binding Integration Tests
      run: make test-python

    - name: Setup Rust Toolchain
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Run Rust FFI Language Binding Integration Tests
      run: make test-rust

    - name: Run PQC Cryptographic Roundtrip tests with Coverage
      run: make coverage

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.info
        fail_ci_if_error: false
