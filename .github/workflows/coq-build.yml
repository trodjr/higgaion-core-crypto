name: Quad-Tier Formal Verification & C Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make gcc libssl-dev coq lcov

    - name: Run Gallina (Coq) Mechanized Proofs
      run: make verify

    - name: Build C core primitives
      run: make prep obj/pqc_crypto.o

    - name: Setup Golang Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run Go CGO Language Binding Integration Tests
      run: make test-go

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python FFI Dependencies
      run: pip install pytest

    - name: Run Python CTypes Language Binding Integration Tests
      run: make test-python

    - name: Setup Rust Toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Run Rust FFI Language Binding Integration Tests
      run: make test-rust

    - name: Run PQC Cryptographic Roundtrip tests with Coverage
      run: make coverage

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.info
        fail_ci_if_error: false
