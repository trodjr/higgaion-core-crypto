name: "CodeQL Advanced Security Matrix"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 15 * * 0'
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze C100K Memory Physics
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp' ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Initialize CodeQL (Security Extended)
      uses: github/codeql-action/init@38b3b7bf288d49ccf58644769dc7a6afdccd05eb # v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality
    - name: Compile Global Repository Structure
      run: |
        sudo apt-get update && sudo apt-get install -y libssl-dev coq
        make all
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@603b797f8b14b413fe025cd935a91c16c4782713 # v3
      with:
        category: "/language:${{matrix.language}}"
        upload: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
